services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synaptic_lattice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - synaptic-lattice-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synaptic_lattice"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  synaptic-lattice-postgres:
